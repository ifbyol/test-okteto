name: Build image in Okteto

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: INJECT ASYMMETRY - force CRLF worktree (GHA side only)
        run: |
          git config --global core.autocrlf true
          git config core.autocrlf true
          git rm -r --cached . -q
          git reset --hard -q
          echo "--- after renormalize ---"
          git ls-files --eol Dockerfile .dockerignore
          git status --short
          sha256sum Dockerfile .dockerignore
          wc -c Dockerfile .dockerignore

      - name: Smart build forensics (inside the action image)
        run: |
          docker run --rm -v "$PWD:/github/workspace" -w /github/workspace \
            --entrypoint sh ghcr.io/okteto/okteto:3.22.0 -c \
            'git config --global --add safe.directory /github/workspace >/dev/null 2>&1; . ./forensics.sh GHA'

      - name: Set Okteto context
        uses: okteto/context@latest
        with:
          url: ${{ secrets.OKTETO_URL }}
          token: ${{ secrets.OKTETO_TOKEN }}

      - name: Build service-a
        uses: okteto/build@latest
        with:
          path: service-a
